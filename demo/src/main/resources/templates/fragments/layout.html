<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Fragmentos compartidos por todas las vistas -->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' | Panadería El Buen Pan'">Panadería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar-pan { background: #8B5A2B; }
    @media print { .no-print { display: none !important; } body { background: #fff !important; } }
  </style>
</head>
<body>

<nav th:fragment="navbar(activo)" class="navbar navbar-expand-md navbar-dark navbar-pan no-print">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/productos}">🥖 El Buen Pan</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="menu" class="collapse navbar-collapse">
      <div class="navbar-nav me-auto">
        <a class="nav-link" th:classappend="${activo == 'productos'} ? 'active fw-semibold'" th:href="@{/productos}">Productos</a>
        <a class="nav-link" th:classappend="${activo == 'clientes'} ? 'active fw-semibold'" th:href="@{/clientes}">Clientes</a>
        <a class="nav-link" th:classappend="${activo == 'pedidos'} ? 'active fw-semibold'" th:href="@{/pedidos}">Pedidos</a>
        <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active fw-semibold'" th:href="@{/usuarios}">Usuarios</a>
      </div>
      <a class="btn btn-warning btn-sm fw-semibold" th:href="@{/pedidos/nuevo}">+ Generar orden</a>
    </div>
  </div>
</nav>

<th:block th:fragment="alertas">
  <div class="alert alert-success alert-dismissible fade show no-print" th:if="${mensaje}">
    <span th:text="${mensaje}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show no-print" th:if="${error}">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</th:block>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
