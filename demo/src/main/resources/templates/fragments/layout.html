<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Panadería El Buen Pan'">Panadería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="menu(activo)" class="navbar navbar-expand-lg navbar-dark navbar-pan no-print">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/menu}">🥖 El Buen Pan</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="menuPrincipal" class="collapse navbar-collapse" th:if="${usuarioActual != null}">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'" th:href="@{/menu}">Menú</a>
                </li>
                <th:block th:if="${usuarioActual.admin}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'usuarios'} ? 'active'" th:href="@{/admin/usuarios}">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'categorias'} ? 'active'" th:href="@{/admin/categorias}">Categorías</a>
                    </li>
                </th:block>
                <th:block th:unless="${usuarioActual.cliente}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'productos'} ? 'active'" th:href="@{/productos}">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'pedidos'} ? 'active'" th:href="@{/pedidos}">Pedidos</a>
                    </li>
                </th:block>
                <th:block th:if="${usuarioActual.cliente}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'nuevo'} ? 'active'" th:href="@{/tienda/nuevo-pedido}">Nuevo pedido</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activo == 'mis-pedidos'} ? 'active'" th:href="@{/tienda/mis-pedidos}">Mis pedidos</a>
                    </li>
                </th:block>
            </ul>
            <div class="d-flex align-items-center gap-2 text-white">
                <span th:text="${usuarioActual.nombre}"></span>
                <span class="badge text-bg-light" th:text="${usuarioActual.rol.etiqueta}"></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<th:block th:fragment="alertas">
    <div class="alert alert-success alert-dismissible fade show no-print" th:if="${mensaje}">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show no-print" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</th:block>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
