<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('usuarios')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Usuarios del sistema</h1>
        <a class="btn btn-pan" th:href="@{/admin/usuarios/nuevo}">+ Nuevo usuario</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th><th>Nombre</th><th>Correo</th><th>Celular</th><th>Perfil</th><th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td class="fw-semibold" th:text="${u.nombre}"></td>
                <td th:text="${u.correo}"></td>
                <td th:text="${u.telefono} ?: '—'"></td>
                <td><span class="badge text-bg-dark" th:text="${u.rol.etiqueta}"></span></td>
                <td>
                    <span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
                </td>
                <td class="text-center text-nowrap">
                    <a class="btn btn-sm btn-primary" th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}">
                        <button class="btn btn-sm btn-outline-secondary" type="submit"
                                th:text="${u.activo} ? 'Desactivar' : 'Activar'"></button>
                    </form>
                    <form class="d-inline" method="post" th:action="@{/admin/usuarios/{id}/eliminar(id=${u.id})}"
                          onsubmit="return confirm('¿Eliminar este usuario?');">
                        <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
