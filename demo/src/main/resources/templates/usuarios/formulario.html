<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('usuarios')}"></nav>
<main class="container py-4" style="max-width: 680px">
    <h1 class="h4 mb-3" th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>

    <form class="card card-body shadow-sm" th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" novalidate>
        <div class="alert alert-danger" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="correo">Correo</label>
                <input class="form-control" type="email" th:field="*{correo}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{correo}"></div>
            </div>
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid"
                       th:placeholder="${usuario.id != null} ? 'Dejar vacío para no cambiarla' : ''">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="telefono">Celular</label>
                <input class="form-control" type="tel" maxlength="9" th:field="*{telefono}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{telefono}"></div>
            </div>
            <div class="col-sm-6 mb-3">
                <label class="form-label" for="rol">Perfil</label>
                <select class="form-select" th:field="*{rol}" th:errorclass="is-invalid">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{rol}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="direccion">Dirección</label>
            <input class="form-control" type="text" th:field="*{direccion}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{direccion}"></div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{activo}">
            <label class="form-check-label" th:for="${#ids.prev('activo')}">Cuenta activa</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-pan" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
