<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('pedidos')}"></nav>
<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h4 mb-0">Pedidos / Órdenes</h1>
    <a class="btn btn-success" th:href="@{/pedidos/nuevo}">+ Generar orden</a>
  </div>
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div class="btn-group flex-wrap">
      <a class="btn btn-outline-dark btn-sm" th:classappend="${estado == null} ? 'active'" th:href="@{/pedidos}">Todos</a>
      <a th:each="e : ${estados}" class="btn btn-outline-dark btn-sm" th:classappend="${estado == e} ? 'active'"
         th:href="@{/pedidos(estado=${e})}" th:text="${e}"></a>
    </div>
    <span class="text-muted">Ventas entregadas (lista actual):
      <strong class="text-success" th:text="'S/ ' + ${#numbers.formatDecimal(ventas, 1, 2, 'POINT')}"></strong></span>
  </div>

  <div class="table-responsive bg-white shadow-sm rounded">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Producto</th><th class="text-end">Cant.</th><th class="text-end">Total</th><th>Estado</th><th class="text-center">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${pedidos}">
          <td th:text="${#numbers.formatInteger(p.id, 5)}"></td>
          <td class="text-nowrap" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${p.cliente.nombre}"></td>
          <td th:text="${p.producto.nombre}"></td>
          <td class="text-end" th:text="${p.cantidad}"></td>
          <td class="text-end fw-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2, 'POINT')}"></td>
          <td><span class="badge" th:classappend="'text-bg-' + ${p.estado.color}" th:text="${p.estado}"></span></td>
          <td class="text-center text-nowrap">
            <a class="btn btn-sm btn-outline-dark" th:href="@{/pedidos/{id}(id=${p.id})}">Ver orden</a>
            <th:block th:if="${p.pendiente}">
              <a class="btn btn-sm btn-primary" th:href="@{/pedidos/editar/{id}(id=${p.id})}">Editar</a>
              <form class="d-inline" method="post" th:action="@{/pedidos/{id}/entregar(id=${p.id})}">
                <button class="btn btn-sm btn-success" type="submit">Entregar</button>
              </form>
              <form class="d-inline" method="post" th:action="@{/pedidos/{id}/anular(id=${p.id})}"
                    onsubmit="return confirm('¿Anular este pedido? Se devolverá el stock.');">
                <button class="btn btn-sm btn-secondary" type="submit">Anular</button>
              </form>
            </th:block>
            <form th:unless="${p.pendiente}" class="d-inline" method="post" th:action="@{/pedidos/{id}/eliminar(id=${p.id})}"
                  onsubmit="return confirm('¿Eliminar este pedido del historial?');">
              <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="8" class="text-center text-muted py-4">No hay pedidos.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
