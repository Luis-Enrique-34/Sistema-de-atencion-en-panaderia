<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('pedidos')}"></nav>
<main class="container py-4">
    <h1 class="h4 mb-3">Pedidos de los clientes</h1>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="btn-group flex-wrap mb-3">
        <a class="btn btn-sm btn-outline-dark" th:classappend="${estado == null} ? 'active'" th:href="@{/pedidos}">Todos</a>
        <a th:each="e : ${estados}" class="btn btn-sm btn-outline-dark" th:classappend="${estado == e} ? 'active'"
           th:href="@{/pedidos(estado=${e})}" th:text="${e.etiqueta}"></a>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>N°</th><th>Cliente</th><th>Panes</th><th>Entrega</th><th class="text-end">Total</th><th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.cliente.nombre}"></td>
                <td class="small">
                    <div th:each="d : ${p.detalles}" th:text="${d.cantidad} + ' x ' + ${d.producto.nombre}"></div>
                </td>
                <td class="text-nowrap" th:text="${#temporals.format(p.fechaEntrega, 'dd/MM/yyyy')}"></td>
                <td class="text-end fw-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2, 'POINT')}"></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${p.estado.color}" th:text="${p.estado.etiqueta}"></span></td>
                <td class="text-center text-nowrap">
                    <a class="btn btn-sm btn-outline-dark" th:href="@{/pedidos/{id}(id=${p.id})}">Ver</a>
                    <form class="d-inline" method="post" th:if="${p.estado.siguiente != null}"
                          th:action="@{/pedidos/{id}/avanzar(id=${p.id})}">
                        <button class="btn btn-sm btn-success" type="submit"
                                th:text="'Pasar a: ' + ${p.estado.siguiente.etiqueta}"></button>
                    </form>
                    <form class="d-inline" method="post" th:if="${p.cancelable}"
                          th:action="@{/pedidos/{id}/cancelar(id=${p.id})}"
                          onsubmit="return confirm('¿Cancelar este pedido? Se devolverá el stock.');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="7" class="text-center text-muted py-4">No hay pedidos.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
