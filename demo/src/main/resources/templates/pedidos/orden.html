<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle del pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu(${esPersonal ? 'pedidos' : 'mis-pedidos'})}"></nav>
<main class="container py-4" style="max-width: 760px">
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <div class="h4 mb-0">🥖 Panadería El Buen Pan</div>
                    <div class="text-muted small">Orden de pedido</div>
                </div>
                <div class="text-end">
                    <div class="h5 mb-1" th:text="'N° ' + ${pedido.id}"></div>
                    <span class="badge" th:classappend="'text-bg-' + ${pedido.estado.color}" th:text="${pedido.estado.etiqueta}"></span>
                </div>
            </div>

            <div class="row small mb-3">
                <div class="col-sm-6">
                    <div><strong>Cliente:</strong> <span th:text="${pedido.cliente.nombre}"></span></div>
                    <div><strong>Correo:</strong> <span th:text="${pedido.cliente.correo}"></span></div>
                    <div th:if="${pedido.cliente.telefono}"><strong>Celular:</strong> <span th:text="${pedido.cliente.telefono}"></span></div>
                </div>
                <div class="col-sm-6 text-sm-end">
                    <div><strong>Pedido el:</strong> <span th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></span></div>
                    <div><strong>Entrega:</strong> <span th:text="${#temporals.format(pedido.fechaEntrega, 'dd/MM/yyyy')}"></span></div>
                </div>
            </div>

            <table class="table table-bordered mb-2">
                <thead class="table-light">
                <tr><th>Pan</th><th class="text-end">Cantidad</th><th class="text-end">P. unit.</th><th class="text-end">Subtotal</th></tr>
                </thead>
                <tbody>
                <tr th:each="d : ${pedido.detalles}">
                    <td th:text="${d.producto.nombre}"></td>
                    <td class="text-end" th:text="${d.cantidad}"></td>
                    <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2, 'POINT')}"></td>
                    <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 2, 'POINT')}"></td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th class="text-end">Total de panes</th>
                    <th class="text-end" th:text="${pedido.totalPanes}"></th>
                    <th class="text-end">TOTAL</th>
                    <th class="text-end fs-5" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2, 'POINT')}"></th>
                </tr>
                </tfoot>
            </table>
            <p class="small text-muted mb-0" th:if="${pedido.observaciones}" th:text="'Indicaciones: ' + ${pedido.observaciones}"></p>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-3 no-print">
        <button class="btn btn-dark" type="button" onclick="window.print()">Imprimir</button>

        <th:block th:if="${esPersonal}">
            <form method="post" th:if="${pedido.estado.siguiente != null}" th:action="@{/pedidos/{id}/avanzar(id=${pedido.id})}">
                <button class="btn btn-success" type="submit" th:text="'Pasar a: ' + ${pedido.estado.siguiente.etiqueta}"></button>
            </form>
            <form method="post" th:if="${pedido.cancelable}" th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}"
                  onsubmit="return confirm('¿Cancelar este pedido? Se devolverá el stock.');">
                <button class="btn btn-outline-danger" type="submit">Cancelar pedido</button>
            </form>
            <a class="btn btn-outline-secondary ms-auto" th:href="@{/pedidos}">Volver a pedidos</a>
        </th:block>

        <th:block th:unless="${esPersonal}">
            <form method="post" th:if="${pedido.pendiente}" th:action="@{/tienda/mis-pedidos/{id}/cancelar(id=${pedido.id})}"
                  onsubmit="return confirm('¿Cancelar tu pedido?');">
                <button class="btn btn-outline-danger" type="submit">Cancelar pedido</button>
            </form>
            <a class="btn btn-outline-secondary ms-auto" th:href="@{/tienda/mis-pedidos}">Volver a mis pedidos</a>
        </th:block>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
