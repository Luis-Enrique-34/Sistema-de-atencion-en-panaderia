<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cliente')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>
<main class="container py-4" style="max-width:640px">
  <h1 class="h4 mb-3" th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'">Cliente</h1>

  <form class="card card-body shadow-sm" th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" novalidate>
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre completo</label>
      <input class="form-control" type="text" th:field="*{nombre}" maxlength="100" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{nombre}"></div>
    </div>
    <div class="row">
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="dni">DNI</label>
        <input class="form-control" type="text" inputmode="numeric" maxlength="8" th:field="*{dni}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{dni}"></div>
      </div>
      <div class="col-sm-6 mb-3">
        <label class="form-label" for="telefono">Celular (opcional)</label>
        <input class="form-control" type="tel" inputmode="numeric" maxlength="9" th:field="*{telefono}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{telefono}"></div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="direccion">Dirección (opcional)</label>
      <input class="form-control" type="text" maxlength="150" th:field="*{direccion}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{direccion}"></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
