<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('categorias')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Categorías de pan</h1>
        <a class="btn btn-pan" th:href="@{/admin/categorias/nuevo}">+ Nueva categoría</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th class="text-center">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.id}"></td>
                <td class="fw-semibold" th:text="${c.nombre}"></td>
                <td th:text="${c.descripcion} ?: '—'"></td>
                <td class="text-center text-nowrap">
                    <a class="btn btn-sm btn-primary" th:href="@{/admin/categorias/editar/{id}(id=${c.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/admin/categorias/{id}/eliminar(id=${c.id})}"
                          onsubmit="return confirm('¿Eliminar esta categoría?');">
                        <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="4" class="text-center text-muted py-4">No hay categorías.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
