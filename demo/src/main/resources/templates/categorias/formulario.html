<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('categorias')}"></nav>
<main class="container py-4" style="max-width: 600px">
    <h1 class="h4 mb-3" th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h1>

    <form class="card card-body shadow-sm" th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="descripcion">Descripción (opcional)</label>
            <input class="form-control" type="text" th:field="*{descripcion}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-pan" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/categorias}">Cancelar</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
