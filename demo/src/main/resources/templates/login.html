<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="card shadow-sm w-100 tarjeta-login">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="display-6">🥖</div>
                <h1 class="h4 mb-0">Panadería El Buen Pan</h1>
                <p class="text-muted small">Inicia sesión para continuar</p>
            </div>

            <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está desactivada.</div>
            <div class="alert alert-info" th:if="${param.logout}">Cerraste sesión correctamente.</div>
            <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="correo">Correo</label>
                    <input class="form-control" type="email" id="correo" name="correo" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Contraseña</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <button class="btn btn-pan w-100" type="submit">Ingresar</button>
            </form>

            <p class="text-center small mt-3 mb-0">
                ¿Eres cliente nuevo? <a th:href="@{/registro}">Crea tu cuenta</a>
            </p>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
