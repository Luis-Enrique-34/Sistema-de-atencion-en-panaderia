<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('inicio')}"></nav>
<main class="container py-4">
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>
    <h1 class="h3">Hola, <span th:text="${usuarioActual.nombre}"></span> 👋</h1>
    <p class="text-muted">Perfil: <strong th:text="${usuarioActual.rol.etiqueta}"></strong></p>

    <div th:if="${usuarioActual.cliente}" class="row g-3">
        <div class="col-md-6">
            <a class="card tarjeta-menu shadow-sm text-decoration-none h-100" th:href="@{/tienda/nuevo-pedido}">
                <div class="card-body">
                    <div class="fs-1">🧺</div>
                    <h2 class="h5 text-dark">Hacer un nuevo pedido</h2>
                    <p class="text-muted mb-0">Elige y mezcla los tipos de pan que quieras.</p>
                </div>
            </a>
        </div>
        <div class="col-md-6">
            <a class="card tarjeta-menu shadow-sm text-decoration-none h-100" th:href="@{/tienda/mis-pedidos}">
                <div class="card-body">
                    <div class="fs-1">📋</div>
                    <h2 class="h5 text-dark">Mis pedidos</h2>
                    <p class="text-muted mb-0">Tienes <strong th:text="${totalPedidos}"></strong> pedido(s) en tu historial.</p>
                </div>
            </a>
        </div>
    </div>

    <th:block th:unless="${usuarioActual.cliente}">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <a class="card tarjeta-menu shadow-sm text-decoration-none" th:href="@{/pedidos(estado='PENDIENTE')}">
                    <div class="card-body">
                        <div class="text-muted">Pedidos pendientes</div>
                        <div class="display-6 text-warning" th:text="${pendientes}"></div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a class="card tarjeta-menu shadow-sm text-decoration-none" th:href="@{/pedidos(estado='EN_PREPARACION')}">
                    <div class="card-body">
                        <div class="text-muted">En preparación</div>
                        <div class="display-6 text-info" th:text="${enPreparacion}"></div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a class="card tarjeta-menu shadow-sm text-decoration-none" th:href="@{/pedidos(estado='LISTO')}">
                    <div class="card-body">
                        <div class="text-muted">Listos para entregar</div>
                        <div class="display-6 text-primary" th:text="${listos}"></div>
                    </div>
                </a>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white fw-semibold">Panes con stock bajo (menos de 20 unidades)</div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between" th:each="p : ${stockBajo}">
                    <span th:text="${p.nombre}"></span>
                    <span class="badge text-bg-danger" th:text="${p.stock} + ' und.'"></span>
                </li>
                <li class="list-group-item text-muted" th:if="${#lists.isEmpty(stockBajo)}">Todo el stock está en orden.</li>
            </ul>
        </div>
    </th:block>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
