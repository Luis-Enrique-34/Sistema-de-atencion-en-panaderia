<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h4 mb-0">Usuarios del sistema</h1>
    <a class="btn btn-success" th:href="@{/usuarios/nuevo}">+ Agregar nuevo</a>
  </div>
  <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

  <div class="table-responsive bg-white shadow-sm rounded">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light"><tr><th>ID</th><th>Nombre</th><th>Correo</th><th class="text-center">Acciones</th></tr></thead>
      <tbody>
        <tr th:each="usuario : ${listaUsuarios}">
          <td th:text="${usuario.id}"></td>
          <td th:text="${usuario.nombre}"></td>
          <td th:text="${usuario.correo}"></td>
          <td class="text-center text-nowrap">
            <a class="btn btn-sm btn-primary" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
            <form class="d-inline" method="post" th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                  onsubmit="return confirm('¿Eliminar este usuario?');">
              <button class="btn btn-sm btn-danger" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaUsuarios)}"><td colspan="4" class="text-center text-muted py-4">No hay usuarios.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
