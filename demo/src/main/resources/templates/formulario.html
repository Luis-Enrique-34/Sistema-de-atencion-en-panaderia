<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuario')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>
<main class="container py-4" style="max-width:640px">
  <h1 class="h4 mb-3" th:text="${usuario.id == null} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>

  <form class="card card-body shadow-sm" th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" novalidate>
    <input type="hidden" th:field="*{id}">
    <div class="mb-3">
      <label class="form-label" for="nombre">Nombre</label>
      <input class="form-control" type="text" th:field="*{nombre}" maxlength="100" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{nombre}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="correo">Correo</label>
      <input class="form-control" type="email" th:field="*{correo}" maxlength="150" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{correo}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid"
             th:placeholder="${usuario.id != null} ? 'Dejar vacío para no cambiarla' : ''">
      <div class="invalid-feedback" th:errors="*{password}"></div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-success" type="submit">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
