<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis pedidos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('mis-pedidos')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Mi historial de pedidos</h1>
        <a class="btn btn-pan" th:href="@{/tienda/nuevo-pedido}">+ Nuevo pedido</a>
    </div>
    <th:block th:replace="~{fragments/layout :: alertas}"></th:block>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr><th>N°</th><th>Pedido el</th><th>Entrega</th><th>Panes</th><th class="text-end">Total</th><th>Estado</th><th class="text-center">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.id}"></td>
                <td class="text-nowrap" th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                <td class="text-nowrap" th:text="${#temporals.format(p.fechaEntrega, 'dd/MM/yyyy')}"></td>
                <td class="small">
                    <div th:each="d : ${p.detalles}" th:text="${d.cantidad} + ' x ' + ${d.producto.nombre}"></div>
                </td>
                <td class="text-end fw-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2, 'POINT')}"></td>
                <td><span class="badge" th:classappend="'text-bg-' + ${p.estado.color}" th:text="${p.estado.etiqueta}"></span></td>
                <td class="text-center text-nowrap">
                    <a class="btn btn-sm btn-outline-dark" th:href="@{/tienda/mis-pedidos/{id}(id=${p.id})}">Ver</a>
                    <form class="d-inline" method="post" th:if="${p.pendiente}"
                          th:action="@{/tienda/mis-pedidos/{id}/cancelar(id=${p.id})}"
                          onsubmit="return confirm('¿Cancelar tu pedido?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Cancelar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="7" class="text-center text-muted py-4">Todavía no tienes pedidos. ¡Haz el primero!</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
