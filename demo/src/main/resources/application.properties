spring.application.name=demo

# Puerto de la aplicacion (http://localhost:8084/productos)
server.port=8084

# XAMPP trae MariaDB (compatible con MySQL): se usa su driver oficial.
# Usuario root sin contrasena. La BD panaderia se crea sola si no existe.
spring.datasource.url=jdbc:mariadb://localhost:3306/panaderia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate: crea o actualiza las tablas "productos" y "usuarios" a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
